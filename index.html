<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一路向前｜電子書</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #eef8fc 0%, #fffdf8 100%);
    color: #526b78;
    text-align: center;
}

h1 {
    margin: 28px 0 4px;
    font-size: 28px;
    color: #405c6a;
    letter-spacing: 3px;
}

.subtitle {
    margin-bottom: 20px;
    color: #78909c;
    font-size: 15px;
}

.reader {
    width: min(920px, 94vw);
    margin: auto;
    background: white;
    border-radius: 22px;
    box-shadow: 0 8px 30px rgba(80, 110, 120, 0.12);
    overflow: hidden;
}

.toolbar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 14px;
    background: #ffffff;
}

button {
    border: none;
    background: #edf5f8;
    color: #536d79;
    padding: 9px 15px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #dcecf2;
}

#pageInfo {
    padding: 0 5px;
    white-space: nowrap;
}

.book {
    background: #f8f5ed;
    padding: 12px;
}

#mainImage {
    display: block;
    width: 100%;
    max-height: 76vh;
    object-fit: contain;
    margin: auto;
    cursor: zoom-in;
    transition: transform 0.2s ease;
}

.thumbnails {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px;
    background: white;
}

.thumbnails img {
    width: 62px;
    height: 82px;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    opacity: 0.65;
    border: 2px solid transparent;
}

.thumbnails img.active {
    opacity: 1;
    border-color: #8eb8c8;
}

.hint {
    padding: 8px 15px 18px;
    font-size: 12px;
    color: #91a2aa;
}

/* 全螢幕 */
.fullscreen {
    position: fixed;
    inset: 0;
    background: rgba(20, 30, 35, 0.96);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.fullscreen img {
    max-width: 95vw;
    max-height: 95vh;
    object-fit: contain;
}

.close-fullscreen {
    position: fixed;
    top: 20px;
    right: 25px;
    color: white;
    font-size: 28px;
    cursor: pointer;
}
.fullscreen-prev,
.fullscreen-next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 60px;
    height: 60px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.75);
    color: #52708a;
    font-size: 42px;
    line-height: 1;
    cursor: pointer;
    z-index: 10;
}

.fullscreen-prev {
    left: 25px;
}

.fullscreen-next {
    right: 25px;
}

.fullscreen-prev:hover,
.fullscreen-next:hover {
    background: rgba(255, 255, 255, 0.95);
}
@media (max-width: 600px) {
    h1 {
        font-size: 23px;
    }

    .reader {
        width: 96vw;
        border-radius: 15px;
    }

    .thumbnails img {
        width: 52px;
        height: 70px;
    }
}
</style>
</head>

<body>

<h1>一路向前</h1>
<div class="subtitle">溫柔地，一頁一頁向前走。</div>

<div class="reader">

    <div class="toolbar">
        <button onclick="prevPage()">← 上一頁</button>

        <span id="pageInfo">第 1 / 13 頁</span>

        <button onclick="nextPage()">下一頁 →</button>

        <button onclick="zoomOut()">−</button>
        <span id="zoomText">100%</span>
        <button onclick="zoomIn()">＋</button>

        <button onclick="openFullscreen()">⛶ 全螢幕</button>
    </div>

    <div class="book">
        <img id="mainImage" src="01.png" alt="第1頁">
    </div>

    <div class="thumbnails" id="thumbnails"></div>

    <div class="hint">
        可使用「上一頁／下一頁」，也可以直接點擊下方縮圖翻頁。
    </div>

</div>

<!-- 全螢幕 -->
<div class="fullscreen" id="fullscreen">

    <button class="fullscreen-prev" onclick="prevPage()">‹</button>

    <span class="close-fullscreen" onclick="closeFullscreen()">×</span>

    <img id="fullscreenImage" src="01.png">

    <button class="fullscreen-next" onclick="nextPage()">›</button>

</div>

<script>

const totalPages = 13;
let currentPage = 1;
let zoom = 100;

const mainImage = document.getElementById("mainImage");
const pageInfo = document.getElementById("pageInfo");
const thumbnails = document.getElementById("thumbnails");
const zoomText = document.getElementById("zoomText");
let autoPlayTimer = null;
let autoPlaying = false;

const autoPlayBtn = document.createElement("button");
autoPlayBtn.textContent = "▶ 自動翻頁";
document.querySelector(".toolbar").appendChild(autoPlayBtn);

function toggleAutoPlay() {
  if (autoPlaying) {
    clearInterval(autoPlayTimer);
    autoPlayTimer = null;
    autoPlaying = false;
    autoPlayBtn.textContent = "▶ 自動翻頁";
    return;
  }

  autoPlaying = true;
  autoPlayBtn.textContent = "⏸ 暫停翻頁";

  autoPlayTimer = setInterval(function() {
    if (currentPage < totalPages) {
      nextPage();
    } else {
      clearInterval(autoPlayTimer);
      autoPlayTimer = null;
      autoPlaying = false;
      autoPlayBtn.textContent = "▶ 自動翻頁";
    }
  }, 5000);
}

autoPlayBtn.onclick = toggleAutoPlay;
/* 建立縮圖 */
for (let i = 1; i <= totalPages; i++) {

    const img = document.createElement("img");

    const number = String(i).padStart(2, "0");

    img.src = number + ".png";
    img.alt = "第" + i + "頁";

    img.onclick = function() {
        showPage(i);
    };

    thumbnails.appendChild(img);
}

/* 顯示頁面 */
function showPage(page) {

    if (page < 1) page = 1;
    if (page > totalPages) page = totalPages;

    currentPage = page;

    const number = String(page).padStart(2, "0");
    const imagePath = number + ".png";

    mainImage.src = imagePath;
    mainImage.alt = "第" + page + "頁";
    document.getElementById("fullscreenImage").src = imagePath;

    pageInfo.textContent =
        "第 " + page + " / " + totalPages + " 頁";

    document.querySelectorAll(".thumbnails img")
        .forEach((img, index) => {

            img.classList.toggle(
                "active",
                index + 1 === page
            );

        });

    zoom = 100;
    updateZoom();
}

/* 上一頁 */
function prevPage() {
    if (currentPage > 1) {
        showPage(currentPage - 1);
    }
}

/* 下一頁 */
function nextPage() {
    if (currentPage < totalPages) {
        showPage(currentPage + 1);
    }
}

/* 放大 */
function zoomIn() {

    zoom += 10;

    if (zoom > 200) {
        zoom = 200;
    }

    updateZoom();
}

/* 縮小 */
function zoomOut() {

    zoom -= 10;

    if (zoom < 50) {
        zoom = 50;
    }

    updateZoom();
}

/* 更新大小 */
function updateZoom() {

    mainImage.style.width = zoom + "%";
    zoomText.textContent = zoom + "%";
}

/* 全螢幕 */
function openFullscreen() {

    document.getElementById("fullscreenImage").src =
        mainImage.src;

    document.getElementById("fullscreen").style.display =
        "flex";
}

/* 關閉全螢幕 */
function closeFullscreen() {

    document.getElementById("fullscreen").style.display =
        "none";
}

/* 鍵盤翻頁 */
document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowRight") {
        nextPage();
    }

    if (event.key === "ArrowLeft") {
        prevPage();
    }

    if (event.key === "Escape") {
        closeFullscreen();
    }

});

/* 初始頁 */
showPage(1);

</script><script>
const bgMusic = new Audio("music.mp3");

bgMusic.loop = true;
bgMusic.volume = 0.35;

function startBackgroundMusic() {
    bgMusic.play().catch(() => {});
}

document.addEventListener("click", startBackgroundMusic);
document.addEventListener("keydown", startBackgroundMusic);
</script>

</body>
</html>
