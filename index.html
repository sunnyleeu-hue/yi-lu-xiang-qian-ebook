<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一路向前｜電子書</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: #f4f0e8;
    color: #5f625c;
    text-align: center;
    min-height: 100vh;
}


h1 {
    margin: 30px 0 6px;
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 5px;
    color: #5d665d;
}


.subtitle {
    margin-bottom: 24px;
    color: #9a9a8f;
    font-size: 14px;
    letter-spacing: 2px;
}


.reader {
    width: min(900px, 92vw);
    margin: 0 auto 35px;
    background: #fffdf9;
    border-radius: 18px;
    box-shadow:
        0 12px 35px rgba(100, 90, 70, 0.10),
        0 2px 8px rgba(100, 90, 70, 0.06);
    overflow: hidden;
    border: 1px solid rgba(160, 145, 120, 0.12);
}

.toolbar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 14px 18px;
    background: #faf7f0;
    border-bottom: 1px solid #eee8dc;
}

button {
    border: 1px solid #e3ddd1;
    background: #fffdf9;
    color: #6f756d;
    padding: 9px 16px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 2px 6px rgba(100, 90, 70, 0.05);
}
button:hover {
    background: #f1ece2;
    border-color: #d4ccbd;
    transform: translateY(-1px);
}

button:active {
    transform: translateY(0);
}


#pageInfo {
    padding: 0 5px;
    white-space: nowrap;
}

.book {
    background: #f8f5ed;
    padding: 16px;
    border-radius: 16px;
    box-shadow:
        0 4px 16px rgba(80, 70, 55, 0.08),
        0 1px 3px rgba(80, 70, 55, 0.05);
    border: 1px solid rgba(180, 165, 145, 0.25);
}

#mainImage {
    display: block;
    width: 100%;
    max-height: 76vh;
    object-fit: contain;
    margin: auto;
    cursor: zoom-in;
    transition: transform 0.2s ease;
}

.thumbnails {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 14px 16px;
    background: #faf8f3;
    border-top: 1px solid rgba(180, 165, 145, 0.18);
    scrollbar-width: thin;
}

.thumbnails img {
    width: 62px;
    height: 82px;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    opacity: 0.55;
    border: 2px solid transparent;
    transition: all 0.25s ease;
    box-shadow: 0 2px 6px rgba(80, 70, 55, 0.08);
}

.thumbnails img:hover {
    opacity: 0.85;
    transform: translateY(-2px);
}

.thumbnails img.active {
    opacity: 1;
    border-color: #8eb8c8;
    box-shadow: 0 3px 10px rgba(100, 140, 150, 0.18);
    transform: translateY(-2px);
}

.hint {
    padding: 8px 15px 18px;
    font-size: 12px;
    color: #91a2aa;
}

/* 全螢幕 */
.fullscreen {
    position: fixed;
    inset: 0;
    background: rgba(20, 30, 35, 0.96);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.fullscreen img {
    max-width: 95vw;
    max-height: 95vh;
    object-fit: contain;
}

.close-fullscreen {
    position: fixed;
    top: 20px;
    right: 25px;
    color: white;
    font-size: 28px;
    cursor: pointer;
}
/* 全螢幕翻頁按鈕 */
.fullscreen-prev,
.fullscreen-next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 90px;
    border: none;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.16);
    color: rgba(255, 255, 255, 0.85);
    font-size: 32px;
    font-weight: 300;
    cursor: pointer;
    z-index: 10;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.fullscreen-prev {
    left: 18px;
}

.fullscreen-next {
    right: 18px;
}

.fullscreen-prev:hover,
.fullscreen-next:hover {
    background: rgba(255, 255, 255, 0.28);
    color: white;
}
}
@media (max-width: 600px) {
    h1 {
        font-size: 23px;
    }

    .reader {
        width: 96vw;
        border-radius: 15px;
    }

    .thumbnails img {
        width: 52px;
        height: 70px;
    }
}
</style>
</head>

<body>

<h1>一路向前</h1>
<div class="subtitle">溫柔地，一頁一頁向前走。</div>

<div class="reader">

    <div class="toolbar">
        <button onclick="prevPage()">← 上一頁</button>

        <span id="pageInfo">第 1 / 13 頁</span>

        <button onclick="nextPage()">下一頁 →</button>

        <button onclick="zoomOut()">−</button>
        <span id="zoomText">100%</span>
        <button onclick="zoomIn()">＋</button>

        <button onclick="openFullscreen()">⛶ 全螢幕</button>
        <button onclick="shareBook()">↗ 分享</button>
    </div>

    <div class="book">
        <img id="mainImage" src="01.png" alt="第1頁">
    </div>

    <div class="thumbnails" id="thumbnails"></div>

    <div class="hint">
        可使用「上一頁／下一頁」，也可以直接點擊下方縮圖翻頁。
    </div>

</div>

<!-- 全螢幕 -->
<div class="fullscreen" id="fullscreen">

    <button class="fullscreen-prev" onclick="prevPage()">‹</button>

    <span class="close-fullscreen" onclick="closeFullscreen()">×</span>

    <img id="fullscreenImage" src="01.png">

    <button class="fullscreen-next" onclick="nextPage()">›</button>

</div>

<script>

const totalPages = 13;
let currentPage = 1;
let zoom = 100;

const mainImage = document.getElementById("mainImage");
const pageInfo = document.getElementById("pageInfo");
const thumbnails = document.getElementById("thumbnails");
const zoomText = document.getElementById("zoomText");
let autoPlayTimer = null;
let autoPlaying = false;

const autoPlayBtn = document.createElement("button");
autoPlayBtn.textContent = "▶ 自動翻頁";
document.querySelector(".toolbar").appendChild(autoPlayBtn);

function toggleAutoPlay() {

    // 如果正在自動翻頁 → 暫停
    if (autoPlaying) {

        clearInterval(autoPlayTimer);
        autoPlayTimer = null;

        autoPlaying = false;

        autoPlayBtn.textContent = "▶ 自動翻頁";

        return;
    }

    // 開始自動翻頁
    autoPlaying = true;

    autoPlayBtn.textContent = "Ⅱ 暫停翻頁";

    autoPlayTimer = setInterval(function() {

        let nextPage = currentPage + 1;

        // 到最後一頁 → 回到第 1 頁
        if (nextPage > totalPages) {
            nextPage = 1;
        }

        showPage(nextPage);

    }, 5000);
}


// 綁定按鈕
autoPlayBtn.onclick = toggleAutoPlay;
/* 建立縮圖 */
for (let i = 1; i <= totalPages; i++) {

    const img = document.createElement("img");

    const number = String(i).padStart(2, "0");

    img.src = number + ".png";
    img.alt = "第" + i + "頁";

    img.onclick = function() {
        showPage(i);
    };

    thumbnails.appendChild(img);
}

/* 顯示頁面 */
function showPage(page) {

    if (page < 1) page = 1;
    if (page > totalPages) page = totalPages;

    currentPage = page;

    const number = String(page).padStart(2, "0");
    const imagePath = number + ".png";

    mainImage.src = imagePath;
    mainImage.alt = "第" + page + "頁";
    document.getElementById("fullscreenImage").src = imagePath;

    pageInfo.textContent =
        "第 " + page + " / " + totalPages + " 頁";

    document.querySelectorAll(".thumbnails img")
        .forEach((img, index) => {

            img.classList.toggle(
                "active",
                index + 1 === page
            );

        });

    zoom = 100;
    updateZoom();
}

/* 上一頁 */
function prevPage() {
    if (currentPage > 1) {
        showPage(currentPage - 1);
    }
}

/* 下一頁 */
function nextPage() {
    if (currentPage < totalPages) {
        showPage(currentPage + 1);
    }
}

/* 放大 */
function zoomIn() {

    zoom += 10;

    if (zoom > 200) {
        zoom = 200;
    }

    updateZoom();
}

/* 縮小 */
function zoomOut() {

    zoom -= 10;

    if (zoom < 50) {
        zoom = 50;
    }

    updateZoom();
}

/* 更新大小 */
function updateZoom() {

    mainImage.style.width = zoom + "%";
    zoomText.textContent = zoom + "%";
}

/* 全螢幕 */
function openFullscreen() {

    document.getElementById("fullscreenImage").src =
        mainImage.src;

    document.getElementById("fullscreen").style.display =
        "flex";
}

/* 關閉全螢幕 */
function closeFullscreen() {

    document.getElementById("fullscreen").style.display =
        "none";
}
/* 分享電子書 */
function shareBook() {

    const shareData = {
        title: "《一路向前》｜電子書",
        text: "邀請你一起閱讀《一路向前》",
        url: window.location.href
    };

    // 手機或支援分享功能的瀏覽器
    if (navigator.share) {

        navigator.share(shareData)
            .catch(function(error) {
                console.log("分享取消");
            });

    } else {

        // 電腦瀏覽器：複製網址
        navigator.clipboard.writeText(window.location.href)
            .then(function() {
                alert("電子書連結已複製！\n可以貼到 WhatsApp、Facebook 或 Messenger 分享。");
            })
            .catch(function() {
                alert("請直接複製瀏覽器上方的網址分享。");
            });
    }
}
/* 鍵盤翻頁 */
document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowRight") {
        nextPage();
    }

    if (event.key === "ArrowLeft") {
        prevPage();
    }

    if (event.key === "Escape") {
        closeFullscreen();
    }

});

/* 初始頁 */
showPage(1);

</script><script>
const bgMusic = new Audio("music.mp3");

bgMusic.loop = true;
bgMusic.volume = 0.35;

function startBackgroundMusic() {
    bgMusic.play().catch(() => {});
}

document.addEventListener("click", startBackgroundMusic);
document.addEventListener("keydown", startBackgroundMusic);
</script>

</body>
</html>
